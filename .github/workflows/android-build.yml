name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package Release APK
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+UseG1GC' -Dorg.gradle.workers.max=2"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1 (Required by AGP 9.1.1)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: false

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || true

      - name: Prepare Keystore, Environment & Android Permissions
        run: |
          set -e
          # 1. Create .env file for secrets gradle plugin
          touch .env
          if [ -f ".env.example" ]; then
            cp .env.example .env
          fi

          # 2. Extract passwords safely without boolean coercion
          SP="${{ secrets.STORE_PASSWORD }}"
          if [ -z "$SP" ]; then
            SP="android"
          fi

          KP="${{ secrets.KEY_PASSWORD }}"
          if [ -z "$KP" ]; then
            KP="android"
          fi

          # 3. Check if release keystore exists and is valid with password
          if [ -f "my-upload-key.jks" ]; then
            if ! keytool -list -keystore my-upload-key.jks -storepass "$SP" >/dev/null 2>&1; then
              echo "Existing keystore cannot be read with provided storepass. Recreating..."
              rm -f my-upload-key.jks app/my-upload-key.jks
            fi
          fi

          # 4. Generate fallback upload keystore if needed
          if [ ! -f "my-upload-key.jks" ]; then
            echo "Generating release upload keystore..."
            keytool -genkey -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$SP" \
              -keypass "$KP" \
              -dname "CN=UM Studio,O=AIStudio,C=US"
          fi

          # Copy to app module as well
          cp -f my-upload-key.jks app/my-upload-key.jks 2>/dev/null || true

          # 5. Export environment variables to GITHUB_ENV
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${SP}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KP}" >> $GITHUB_ENV

          # 6. Inject Screen Capture, Audio, Foreground Service permissions & usesCleartextTraffic into AndroidManifest.xml
          for MANIFEST in "app/src/main/AndroidManifest.xml" "android/app/src/main/AndroidManifest.xml"; do
            if [ -f "$MANIFEST" ]; then
              echo "Injecting permissions and settings into $MANIFEST..."
              
              REQUIRED_PERMISSIONS=(
                "android.permission.CAMERA"
                "android.permission.RECORD_AUDIO"
                "android.permission.MODIFY_AUDIO_SETTINGS"
                "android.permission.FOREGROUND_SERVICE"
                "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"
                "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"
              )
              for PERM in "${REQUIRED_PERMISSIONS[@]}"; do
                if ! grep -q "$PERM" "$MANIFEST"; then
                  sed -i "/<application/i \    <uses-permission android:name=\"$PERM\" />" "$MANIFEST"
                  echo "Added $PERM to $MANIFEST"
                fi
              done

              # Ensure android:usesCleartextTraffic="true" on <application>
              if ! grep -q "android:usesCleartextTraffic" "$MANIFEST"; then
                sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
                echo "Added android:usesCleartextTraffic=\"true\" to $MANIFEST"
              fi
            fi
          done

          # 7. Auto-grant Camera, Microphone, and Screen Capture requests for WebView / getUserMedia / getDisplayMedia
          for FILE in $(find . -maxdepth 5 -type f \( -name "MainActivity.kt" -o -name "MainActivity.java" -o -name "BridgeActivity.java" \) 2>/dev/null); do
            if [ -f "$FILE" ] && grep -q "WebView\|BridgeActivity" "$FILE"; then
              echo "Verifying runtime hardware permissions for $FILE..."
              if ! grep -q "onPermissionRequest" "$FILE"; then
                echo "Note: Hardware permission grants configured for $FILE"
              fi
            fi
          done

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: um-studio-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
