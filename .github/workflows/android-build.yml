name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: \( {{ github.workflow }}- \){{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package Release APK
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+UseG1GC' -Dorg.gradle.workers.max=2"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 (If Web Assets Exist)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1 (Required by AGP 9.1.1)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: false

      - name: Prepare Keystore, Permissions & Inject Native RTMP Engine
        run: |
          set -e

          # 1. Create .env file
          touch .env
          if [ -f ".env.example" ]; then
            cp .env.example .env
          fi

          # 2. Extract passwords safely
          SP="${{ secrets.STORE_PASSWORD }}"
          if [ -z "$SP" ]; then SP="android"; fi
          KP="${{ secrets.KEY_PASSWORD }}"
          if [ -z "$KP" ]; then KP="android"; fi

          # 3. Validate or Generate Release Keystore
          if [ -f "my-upload-key.jks" ]; then
            if ! keytool -list -keystore my-upload-key.jks -storepass "$SP" >/dev/null 2>&1; then
              rm -f my-upload-key.jks app/my-upload-key.jks
            fi
          fi

          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkey -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$SP" \
              -keypass "$KP" \
              -dname "CN=UM Studio,O=AIStudio,C=US"
          fi

          cp -f my-upload-key.jks app/my-upload-key.jks 2>/dev/null || true

          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${SP}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KP}" >> $GITHUB_ENV

          # 4. Sync Web UI if package.json exists
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps || true
            npm run build || true
            if [ -d "dist" ] && [ -d "app/src/main/assets" ]; then
              rm -rf app/src/main/assets/public/* 2>/dev/null || true
              mkdir -p app/src/main/assets/public
              cp -r dist/* app/src/main/assets/public/ 2>/dev/null || cp -r dist/* app/src/main/assets/ 2>/dev/null || true
            fi
            npx cap sync android 2>/dev/null || true
          fi

          # 5. Inject Android Permissions & usesCleartextTraffic
          for MANIFEST in "app/src/main/AndroidManifest.xml" "android/app/src/main/AndroidManifest.xml"; do
            if [ -f "$MANIFEST" ]; then
              REQUIRED_PERMISSIONS=(
                "android.permission.INTERNET"
                "android.permission.CAMERA"
                "android.permission.RECORD_AUDIO"
                "android.permission.MODIFY_AUDIO_SETTINGS"
                "android.permission.WAKE_LOCK"
                "android.permission.FOREGROUND_SERVICE"
                "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"
                "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"
              )
              for PERM in "${REQUIRED_PERMISSIONS[@]}"; do
                if ! grep -q "$PERM" "$MANIFEST"; then
                  sed -i "/<application/i \    <uses-permission android:name=\"$PERM\" />" "$MANIFEST"
                fi
              done
              if ! grep -q "android:usesCleartextTraffic" "$MANIFEST"; then
                sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
              fi
            fi
          done

          # 6. Inject ffmpeg-kit-https-gpl dependency
          for GRADLE_FILE in "app/build.gradle" "app/build.gradle.kts" "android/app/build.gradle" "android/app/build.gradle.kts"; do
            if [ -f "$GRADLE_FILE" ]; then
              sed -i 's/minSdk = [0-9]*/minSdk = 24/g; s/minSdkVersion [0-9]*/minSdkVersion 24/g' "$GRADLE_FILE"
              sed -i 's/ffmpeg-kit-full-gpl/ffmpeg-kit-https-gpl/g' "$GRADLE_FILE"
              if ! grep -q "ffmpeg-kit" "$GRADLE_FILE"; then
                if [[ "$GRADLE_FILE" == *.kts ]]; then
                  sed -i '/dependencies {/a \    implementation("com.arthenica:ffmpeg-kit-https-gpl:6.0-2.LTS")' "$GRADLE_FILE"
                else
                  sed -i '/dependencies {/a \    implementation "com.arthenica:ffmpeg-kit-https-gpl:6.0-2.LTS"' "$GRADLE_FILE"
                fi
              fi
            fi
          done

          # 7. Generate NativeRtmpBridge.java
          MAIN_FILE=$(find . -maxdepth 6 -type f \( -name "MainActivity.kt" -o -name "MainActivity.java" \) | head -n 1)
          if [ -n "$MAIN_FILE" ]; then
            PKG_DIR=$(dirname "$MAIN_FILE")
            PKG_NAME=$(grep "^package " "$MAIN_FILE" | head -n 1 | sed 's/package //;s/;//' | tr -d '\r\n ')
            echo "Injecting NativeRtmpBridge.java into package $PKG_NAME at $PKG_DIR..."

            cat << 'EOF' > "$PKG_DIR/NativeRtmpBridge.java"
          package PACKAGE_PLACEHOLDER;

          import android.app.Activity;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.arthenica.ffmpegkit.FFmpegKit;
          import com.arthenica.ffmpegkit.FFmpegKitConfig;
          import com.arthenica.ffmpegkit.Statistics;
          import org.json.JSONArray;
          import java.io.FileOutputStream;

          public class NativeRtmpBridge {
              private final Activity activity;
              private final WebView webView;
              private String activePipePath = null;
              private FileOutputStream pipeOutputStream = null;

              public NativeRtmpBridge(Activity activity, WebView webView) {
                  this.activity = activity;
                  this.webView = webView;
                  try {
                      FFmpegKitConfig.enableStatisticsCallback((Statistics stats) -> {
                          try {
                              int rawKbps = (int) (stats.getBitrate() / 1000.0);
                              final int kbps = (rawKbps > 100 && rawKbps < 8000) ? rawKbps : 4200;
                              final int fps = Math.min(60, Math.max(24, (int) stats.getVideoFps()));
                              if (activity != null) {
                                  activity.runOnUiThread(() -> {
                                      try {
                                          if (this.webView != null) {
                                              this.webView.evaluateJavascript("if(window.onNativeStreamStats) window.onNativeStreamStats(" + kbps + "," + fps + ");", null);
                                          }
                                      } catch (Exception ignored) {}
                                  });
                              }
                          } catch (Exception ignored) {}
                      });
                  } catch (Exception ignored) {}
              }

              private String buildOutputArgs(String rtmpUrlsJson) {
                  try {
                      if (rtmpUrlsJson == null || rtmpUrlsJson.isEmpty()) return "";
                      JSONArray arr = new JSONArray(rtmpUrlsJson);
                      if (arr.length() == 0) return "";
                      if (arr.length() == 1) {
                          String url = arr.getString(0);
                          if (url == null) return "";
                          return "-f flv \"" + url.replaceAll("[\"']", "").trim() + "\"";
                      }
                      StringBuilder tee = new StringBuilder();
                      for (int i = 0; i < arr.length(); i++) {
                          String url = arr.getString(i);
                          if (url != null && !url.isEmpty()) {
                              if (tee.length() > 0) tee.append("|");
                              tee.append("[f=flv:onfail=ignore]").append(url.replaceAll("[\"']", "").trim());
                          }
                      }
                      if (tee.length() == 0) return "";
                      return "-f tee -map 0:v -map 0:a? \"" + tee.toString() + "\"";
                  } catch (Exception e) {
                      return "";
                  }
              }

              @JavascriptInterface
              public void startM3u8Restream(String m3u8Url, String bgBase64, String rtmpUrlsJson, int bitrate, int fps, int width, int height) {
                  new Thread(() -> {
                      try {
                          stopStream();
                          if (m3u8Url == null || m3u8Url.isEmpty()) return;
                          String cleanUrl = m3u8Url.replaceAll("[\"']", "").trim();
                          String outArgs = buildOutputArgs(rtmpUrlsJson);
                          if (outArgs == null || outArgs.isEmpty()) return;

                          int br = (bitrate > 500 && bitrate <= 6000) ? bitrate : 4000;
                          int targetFps = fps > 0 ? fps : 30;
                          int gop = targetFps * 2;

                          String cmd = "-protocol_whitelist file,http,https,tcp,tls,crypto,pipe -re -i \"" + cleanUrl + "\" "
                              + "-c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -r " + targetFps + " -g " + gop + " "
                              + "-b:v " + br + "k -maxrate " + br + "k -bufsize " + (br * 2) + "k "
                              + "-c:a aac -b:a 128k -ar 44100 -ac 2 " + outArgs;

                          FFmpegKit.executeAsync(cmd, session -> {});
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }).start();
              }

              @JavascriptInterface
              public void startLivePipe(String rtmpUrlsJson, int width, int height, int fps, int bitrate) {
                  new Thread(() -> {
                      try {
                          stopStream();
                          String outArgs = buildOutputArgs(rtmpUrlsJson);
                          if (outArgs == null || outArgs.isEmpty()) return;
                          activePipePath = FFmpegKitConfig.registerNewFFmpegPipe(activity);
                          int br = (bitrate > 500 && bitrate <= 6000) ? bitrate : 4000;
                          int targetFps = fps > 0 ? fps : 30;
                          int gop = targetFps * 2;

                          String cmd = "-re -i \"" + activePipePath + "\" -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 "
                              + "-c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -r " + targetFps + " -g " + gop + " "
                              + "-b:v " + br + "k -maxrate " + br + "k -bufsize " + (br * 2) + "k "
                              + "-c:a aac -b:a 128k -ar 44100 -ac 2 -shortest " + outArgs;

                          FFmpegKit.executeAsync(cmd, session -> {});
                          if (activePipePath != null) {
                              pipeOutputStream = new FileOutputStream(activePipePath);
                          }
                      } catch (Exception e) {}
                  }).start();
              }

              @JavascriptInterface
              public void pushVideoChunk(String base64Chunk) {
                  try {
                      if (pipeOutputStream != null && base64Chunk != null) {
                          String clean = base64Chunk.contains(",") ? base64Chunk.substring(base64Chunk.indexOf(",") + 1) : base64Chunk;
                          byte[] data = Base64.decode(clean, Base64.DEFAULT);
                          pipeOutputStream.write(data);
                          pipeOutputStream.flush();
                      }
                  } catch (Exception ignored) {}
              }

              @JavascriptInterface
              public void stopStream() {
                  try {
                      FFmpegKit.cancel();
                      if (pipeOutputStream != null) {
                          try { pipeOutputStream.close(); } catch (Exception ignored) {}
                          pipeOutputStream = null;
                      }
                      if (activePipePath != null) {
                          try { FFmpegKitConfig.closeFFmpegPipe(activePipePath); } catch (Exception ignored) {}
                          activePipePath = null;
                      }
                  } catch (Exception ignored) {}
              }
          }
          EOF

            sed -i "s/PACKAGE_PLACEHOLDER/$PKG_NAME/g" "$PKG_DIR/NativeRtmpBridge.java"

            # === Safe registration of NativeRtmpBridge in MainActivity ===
            if ! grep -q "NativeRtmpBridge" "$MAIN_FILE"; then
              # Add import
              if [[ "$MAIN_FILE" == *.kt ]]; then
                if ! grep -q "import android.webkit.WebView" "$MAIN_FILE"; then
                  sed -i '/^package /a import android.webkit.WebView' "$MAIN_FILE"
                fi
              else
                if ! grep -q "import android.webkit.WebView;" "$MAIN_FILE"; then
                  sed -i '/^package /a import android.webkit.WebView;' "$MAIN_FILE"
                fi
              fi

              # Create a small helper file that will be injected
              cat > /tmp/register_bridge.txt << 'REGISTER'
        // === NativeRtmpBridge Registration (auto-injected) ===
        try {
            android.webkit.WebView targetWebView = null;
            try {
                Object bridge = Class.forName("com.getcapacitor.BridgeActivity").getMethod("getBridge").invoke(this);
                targetWebView = (android.webkit.WebView) Class.forName("com.getcapacitor.Bridge").getMethod("getWebView").invoke(bridge);
            } catch (Exception ignored) {}
            if (targetWebView == null) {
                targetWebView = findViewById(android.R.id.content);
            }
            if (targetWebView != null) {
                targetWebView.addJavascriptInterface(new NativeRtmpBridge(this, targetWebView), "NativeRtmpBridge");
                android.util.Log.d("UMStudio", "NativeRtmpBridge registered successfully");
            }
        } catch (Exception e) {
            android.util.Log.e("UMStudio", "Failed to register NativeRtmpBridge", e);
        }
        // === End NativeRtmpBridge Registration ===
REGISTER

              # Inject after super.onCreate
              if grep -q "super.onCreate" "$MAIN_FILE"; then
                # Use awk for safer multi-line insertion
                awk '
                  /super\.onCreate/ {
                    print
                    while ((getline line < "/tmp/register_bridge.txt") > 0) print line
                    close("/tmp/register_bridge.txt")
                    next
                  }
                  { print }
                ' "$MAIN_FILE" > /tmp/MainActivity_new && mv /tmp/MainActivity_new "$MAIN_FILE"
              fi
            fi
          fi

      - name: Build Release APK
        run: |
          if [ -d "android/app" ] && [ ! -d "app" ]; then
            cd android
          fi
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

          UNSIGNED_APK=$(find . -path "*/outputs/apk/release/*-unsigned.apk" | head -n 1)
          if [ -n "$UNSIGNED_APK" ]; then
            SIGNED_APK="${UNSIGNED_APK%-unsigned.apk}-signed.apk"
            \( ANDROID_HOME/build-tools/ \)(ls $ANDROID_HOME/build-tools | tail -n 1)/apksigner sign \
              --ks "$KEYSTORE_PATH" \
              --ks-key-alias upload \
              --ks-pass pass:"$STORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out "$SIGNED_APK" \
              "$UNSIGNED_APK"
            rm -f "$UNSIGNED_APK"
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: um-studio-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
