name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APKs
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD != '' && secrets.STORE_PASSWORD || 'android' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || 'android' }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' && secrets.KEY_ALIAS || 'upload' }}
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+UseG1GC' -Dorg.gradle.workers.max=2"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1 (Required by AGP 9.1.1)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: false

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || true

      - name: Prepare Build Environment & Keystores
        run: |
          set -e
          # 1. Create .env file for secrets gradle plugin
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # 2. Decode debug keystore if base64 file exists
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ -f "debug.keystore" ]; then
            cp -f debug.keystore app/debug.keystore 2>/dev/null || true
          fi

          # 3. Ensure a release upload keystore exists in root and app module
          if [ ! -f "my-upload-key.jks" ]; then
            echo "Generating fallback upload keystore for release build..."
            keytool -genkey -v \
              -keystore my-upload-key.jks \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${STORE_PASSWORD}" \
              -keypass "${KEY_PASSWORD}" \
              -dname "CN=LiveStreamPro,O=AIStudio,C=US"
          fi
          cp -f my-upload-key.jks app/my-upload-key.jks 2>/dev/null || true

          # 4. Export environment variables for subsequent steps
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${STORE_PASSWORD}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KEY_PASSWORD}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${KEY_ALIAS}" >> $GITHUB_ENV

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD != '' && secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' && secrets.KEY_ALIAS || 'upload' }}
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: livestream-pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: livestream-pro-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
